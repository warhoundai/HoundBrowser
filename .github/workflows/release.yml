name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: pip install -r requirements-dev.lock && pip install -e . --no-deps
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q && node --test sdk/js/*.test.mjs && pip-audit --strict
      - name: Check tag matches package
        run: python -c "import os,houndbrowser; assert os.environ['GITHUB_REF_NAME'] == 'v'+houndbrowser.__version__"
      - run: python -m build && cd dist && sha256sum * > SHA256SUMS
      - name: Publish verified release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "HoundBrowser $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
