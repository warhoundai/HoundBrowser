name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: pip install -r requirements-dev.lock && pip install -e . --no-deps
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
      - run: node --test sdk/js/*.test.mjs
      - run: python -m build
      - run: pip-audit --strict -r requirements-dev.lock
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build -t houndbrowser:test .
      - run: docker run --rm -i --network none --shm-size=1g --entrypoint python houndbrowser:test < scripts/container-offline-smoke.py
