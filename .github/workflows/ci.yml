name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: pip install -r requirements-dev.lock && pip install -e . --no-deps
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
      - run: node --test sdk/js/*.test.mjs
      - run: python -m build
      - run: pip-audit --strict
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t houndbrowser:test .
      - run: docker run --rm -i --network none --shm-size=1g --entrypoint python houndbrowser:test < scripts/container-offline-smoke.py
