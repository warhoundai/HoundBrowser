[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "houndbrowser"
version = "0.1.0"
description = "API-first, scoped browser automation for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "WarHound AI"}]
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.38,<1", "playwright==1.65.0", "httpx>=0.28.1,<0.29"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Topic :: Internet :: WWW/HTTP :: Browsers"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "build>=1.2,<2", "pip-audit>=2.9,<3"]

[project.scripts]
houndbrowser = "houndbrowser.cli:main"

[project.urls]
Homepage = "https://ops.warhoundai.com/projects/houndbrowser"
Repository = "https://github.com/warhoundai/HoundBrowser"
Documentation = "https://ops.warhoundai.com/docs/houndbrowser"
Issues = "https://github.com/warhoundai/HoundBrowser/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/houndbrowser"]
